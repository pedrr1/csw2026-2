<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comparações</title>
</head>

<body> 
    <p> <b>Negrito</b> x <strong>Destaque</strong></p>  <!--Strong tem destaque semântico, usado para leitores de tela aumentarem o tom de voz, e por buscadores-->
    <p> <i>Italico</i> x <em>Enfase</em>
    <p> <mark style=color:#ff00ff;>Texto Marcado</mark></p> 
    <p> <big>Grande</big> x <small>Pequeno</small></p> <!--Small ainda é usado em rodapé e textos miudos-->
    <p> <del>Deletado</del> x <strike>Riscado</strike></p>
    <p> <ins>Inserido</ins> x <u>Sublinhado</u></p><!--u Usa um sublinhado tal qual um link, sem valor semantico    -->
    <p> Texto<sup>Sobrescrito</sup> x Texto<sub>Subscrito</sub></p><!--Sem valor semantico, apenas usado para mudar visualmente-->
    <p> Isso é um <code> C&Oacute;DIGO</code> bem legal.</p>
    <p> <address>Endere&ccedil;o: Casa do bobo nº0</address> </p>
    <p>
    <pre><code>>>> print("Hello World!")
>>> Hello World! </code></pre>
    </p>
    <p> <cite>Cita&ccedil;&atilde;o</cite> </p>
    <p> <abbr title="Abrevia&ccedil;&atilde;o"> abrev. </abbr></p>
</body>

</html>
